<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Debora Jiménez López"/>
    <meta name="description" content="Práctica de introducción a las etiquetas video, audio, favicon, iframe y meta"/>
    <meta property="og:title" content="Etiquetas Video, Audio e Iframes. HTML5">
    <meta name="robots" content="noindex"/>
    <title>Etiquetas Video, Audio e Iframes</title>
    <link rel="icon" href="images/favicon-32x3.png" sizes="32x32" type="image/png">
</head>
<body>
    <h1>Etiqueta Video</h1>
    <video width="600" height="400" poster="images/poster.webp" controls>
        <source src="video/Publicar20s.mp4" type="video/mp4"/>
        <source src="video/Publicar20s_ogv.ogv" type="video/ogv"/>
        <source src="video/Publicar20s_webm.webm" type="video/webm"/>
        ¡Error! Tu navegador no acepta este formato.
    </video>
    <h1>Etiqueta Audio</h1>
    <audio controls>
        <source src="audio/audio.m4a" type="audio/m4a">
        <source src="audio/audio.mp3" type="audio/mp3">
        <source src="audio/audio.ogg" type="audio/ogg">
        ¡Error! Tu navegador no acepta este formato.    
    </audio>
    
    <h1>Iframes</h1>
    <iframe width="300" src="http://www.elmundo.es" frameborder="0"></iframe>
    <iframe width="300" src="http://www.elpais.com" frameborder="0"></iframe>
    
    <h2>Youtube</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/eKabc74IU7o?si=5LBBs02fCcdjWIpI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h2>Maps</h2>
    <p>IES Juan Bosco</p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3083.442382527034!2d-3.2219084!3d39.39149659999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e0!3m2!1ses!2ses!4v1795113027464!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
   
</body>
</html>
